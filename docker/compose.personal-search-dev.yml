name: immich-personal-dev

services:
  immich-server:
    container_name: immich_dev_server
    image: immich-personal-search-dev:v3.3.5
    pull_policy: never
    env_file: .env
    environment:
      DB_HOSTNAME: database
      REDIS_HOSTNAME: redis
      IMMICH_MACHINE_LEARNING_URL: http://immich-machine-learning:3003
      IMMICH_QWEN_URL: http://host.docker.internal:28083
      IMMICH_QWEN_TIMEOUT: '180000'
      TZ: Asia/Shanghai
    ports:
      - '${IMMICH_DEV_PORT:-2284}:2283'
    volumes:
      - ${IMMICH_DEV_ROOT:?Set IMMICH_DEV_ROOT}/upload:/usr/src/app/upload
      - dev-data:/data
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  immich-machine-learning:
    container_name: immich_dev_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:v3.3.5
    volumes:
      - dev-model-cache:/cache
    restart: unless-stopped

  redis:
    container_name: immich_dev_redis
    image: docker.io/valkey/valkey:8-bookworm@sha256:fea8b3e67b15729d4bb70589eb03367bab9ad1ee89c876f54327fc7c6e618571
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  database:
    container_name: immich_dev_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:c44be5f2871c59362966d71eab4268170eb6f5653c0e6170184e72b38ffdf107
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_DB: ${DB_DATABASE_NAME:-immich}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - dev-postgres:/var/lib/postgresql/data
    shm_size: 128mb
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  dev-data:
  dev-model-cache:
  dev-postgres:
